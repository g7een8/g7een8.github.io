# Install inside the Nginx `http` context, for example:
# /etc/nginx/sites-available/kezhi.conf on Debian/Ubuntu.
# This site accepts direct HTTP access by IP or domain.

limit_req_zone $binary_remote_addr zone=kezhi_requests:10m rate=12r/s;
limit_conn_zone $binary_remote_addr zone=kezhi_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/kezhi;
    index index.html;
    autoindex off;
    server_tokens off;

    client_max_body_size 8k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_requests 100;
    reset_timedout_connection on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    access_log /var/log/nginx/kezhi-access.log;
    error_log /var/log/nginx/kezhi-error.log warn;

    limit_req zone=kezhi_requests burst=30 nodelay;
    limit_req_status 429;
    limit_conn zone=kezhi_connections 20;
    limit_conn_status 429;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'none'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data:; media-src 'none'; object-src 'none'; script-src 'self'; style-src 'self'; worker-src 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-XSS-Protection "0" always;
    add_header Cache-Control "no-store, max-age=0" always;

    location / {
        try_files $uri $uri/ =404;
        limit_except GET HEAD {
            deny all;
        }
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
